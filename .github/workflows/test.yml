name: Deterministic QA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - run: uv run pytest -q
      - run: uv run python -m qa_agent.cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mock-evaluation
          path: reports/evaluation.json
      - run: uv run python -m qa_agent.evaluator_accuracy
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluator-accuracy
          path: reports/evaluator-accuracy.json
